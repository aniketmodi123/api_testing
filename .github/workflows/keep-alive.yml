name: keep-alive

# Pings the Render /health endpoint on a schedule so the free web service
# never idles out (Render spins free services down after ~15 min of no traffic),
# and each ping runs a DB query that keeps the Aiven Postgres connection warm.
#
# Setup (one time): add a repo secret named RENDER_HEALTH_URL set to the full
# health URL, e.g. https://<your-service>.onrender.com/health
#   GitHub repo -> Settings -> Secrets and variables -> Actions -> New repository secret

on:
  schedule:
    # Every 10 minutes. GitHub may delay scheduled runs under load, so 10 min
    # leaves headroom under Render's 15 min sleep window.
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # allow manual trigger from the Actions tab

# No repo access needed — this job only makes an outbound HTTP request.
permissions: {}

# Never run two pings at once; a slow cold-start ping shouldn't stack.
concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        env:
          HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          set -euo pipefail

          if [ -z "${HEALTH_URL}" ]; then
            echo "::error::RENDER_HEALTH_URL secret is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # --max-time 120: first ping after a spin-down triggers a cold start (~30-60s).
          # --retry 3 with backoff: survive a transient cold-start timeout or 5xx.
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-time 120 \
            --retry 3 --retry-delay 20 --retry-all-errors \
            "${HEALTH_URL}")

          echo "health check returned HTTP ${code}"

          if [ "${code}" != "200" ]; then
            echo "::error::health check failed with HTTP ${code}"
            exit 1
          fi
