version: '3.8'

networks:
    apipilot_network:
        external: true

services:
    apipilot:
        build:
            context: .
            dockerfile: ./docker/Dockerfile.dev
            args:
                - PYTHON_VERSION=tiangolo/uvicorn-gunicorn-fastapi:python3.10-slim
        image: apipilot
        container_name: apipilot
        ports:
            - 7005:8000  # API + embedded MCP (at /mcp-oauth) accessible at localhost:7005
            - 7006:5000  # Debugger accessible at localhost:7006
        env_file:
        - .env
        environment:
            # Public URL clients reach for the embedded MCP server (token page + config snippet).
            - MCP_PUBLIC_URL=http://localhost:7005/mcp-server
        volumes:
            - ./src:/app
            - ./mcp_server:/app/mcp_server  # embedded MCP server sources (imported by main.py)
        command: supervisord -n -c /etc/supervisor/api-supervisord.conf
        networks:
            - apipilot_network

    scheduler:
        build:
            context: .
            dockerfile: ./docker/Dockerfile.dev
            args:
                - PYTHON_VERSION=tiangolo/uvicorn-gunicorn-fastapi:python3.10-slim
        image: apipilot
        container_name: apipilot_scheduler
        env_file:
        - .env
        volumes:
            - ./src:/app
        command: supervisord -n -c /etc/supervisor/scheduler-supervisord.conf
        networks:
            - apipilot_network

    # ALTERNATIVE — two-service mode (separate port/URL for the MCP server). Not needed in
    # single-service mode above (API serves MCP at :7005/mcp-oauth). Uncomment to run the MCP
