version: '3.8'

networks:
    apipilot_network:
        external: true

services:
    apipilot:
        build:
            context: .
            dockerfile: ./docker/Dockerfile.dev
            args:
                - PYTHON_VERSION=tiangolo/uvicorn-gunicorn-fastapi:python3.10-slim
        image: apipilot
        container_name: apipilot
        ports:
            - 7005:8000  # API accessible at localhost:7005
            - 7006:5000  # Debugger accessible at localhost:7006
        env_file:
        - .env
        volumes:
            - ./src:/app
        command: supervisord -n -c /etc/supervisor/api-supervisord.conf
        networks:
            - apipilot_network

    scheduler:
        build:
            context: .
            dockerfile: ./docker/Dockerfile.dev
            args:
                - PYTHON_VERSION=tiangolo/uvicorn-gunicorn-fastapi:python3.10-slim
        image: apipilot
        container_name: apipilot_scheduler
        env_file:
        - .env
        volumes:
            - ./src:/app
        command: supervisord -n -c /etc/supervisor/scheduler-supervisord.conf
        networks:
            - apipilot_network

