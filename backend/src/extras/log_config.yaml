version: 1
disable_existing_loggers: false
formatters:
  default:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
handlers:
  default:
    class: logging.StreamHandler
    formatter: default
loggers:
  watchfiles:
    level: WARNING
    handlers: [default]
    propagate: false
  watchfiles.main:
    level: WARNING
    handlers: [default]
    propagate: false
root:
  level: INFO
  handlers: [default]
